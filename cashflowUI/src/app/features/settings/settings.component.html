<div>
  <cashflow-button (click)="addCategory()" class="header-button" label="Add Category"></cashflow-button>
  <input [formField]="categoryLabelForm" type="text"/>
</div>
@if (categories() && categories().length !== 0) {
  @for (category of categories(); track category.id) {
    <app-category-card (categoryDeleteEvent)="deleteCategory($event)" [category]="category"></app-category-card>
  }
} @else {
  <h2>Can`t find Categories</h2>
}
