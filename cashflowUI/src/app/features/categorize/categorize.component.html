<table>
  <thead class="sticky">
  <tr>
    <th colspan="5">
      <h2>List of Transaktions</h2>
      <cashflow-button (click)="onSave()" label="Save"/>
      <cashflow-button (click)="recategorize()" label="recategorize"/>
    </th>
  </tr>
  <tr>
    <th>Date</th>
    <th>Source</th>
    <th>Purpose</th>
    <th>Amount</th>
    <th>Category</th>
  </tr>
  </thead>
  <tbody>
    @for (transaction of transactions(); track transaction.id) {
      <tr>
        <td>{{ transaction.date }}</td>
        <td>{{ transaction.source }}</td>
        <td>{{ transaction.purpose }}</td>
        <td>{{ transaction.amount }}</td>
        <td>
          <select (ngModelChange)="setIdentifier(transaction.id, $event)" [ngModel]="transaction.identifier">
            <option [ngValue]="null">---</option>
            @for (categoryOption of categoryOptions(); track categoryOption.label) {
              <option [ngValue]="categoryOption.identifier">
                {{ categoryOption.label }}
              </option>
            }
          </select>
        </td>
      </tr>
    }
  </tbody>
</table>
